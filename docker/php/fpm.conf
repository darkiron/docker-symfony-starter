[global]
log_level = debug

[www]
; Listen on all interfaces so Caddy (separate container) can reach FPM
listen = 0.0.0.0:9000
user = www-data
group = www-data

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Très important : on ne chroot PAS, on ne change PAS de docroot
chdir = /

; pas de chroot, pas de doc_root ici
;chroot =
;php_admin_value[doc_root] =

; logs FPM sur stdout/stderr
catch_workers_output = yes
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
